</circle><line x1="580" y1="116" x2="620" y2="116" stroke="#212934" stroke-width="2"/><path d="M 609 111 L 618 116 L 609 121 Z" fill="#3d4655"/><circle r="4.5" fill="#57d38c" opacity="0">
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.1125;0.1250;0.2188;0.2313;1" values="0;0;1;1;0;0"/>
  <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0;0.1125;0.2250;1" values="0,0;0,0;0,0;0,0" path="M 580 116 L 608 116" calcMode="linear"/>
</circle><line x1="870" y1="116" x2="910" y2="116" stroke="#212934" stroke-width="2"/><path d="M 899 111 L 908 116 L 899 121 Z" fill="#3d4655"/><circle r="4.5" fill="#57d38c" opacity="0">
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.2250;0.2375;0.3312;0.3438;1" values="0;0;1;1;0;0"/>
  <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0;0.2250;0.3375;1" values="0,0;0,0;0,0;0,0" path="M 870 116 L 898 116" calcMode="linear"/>
</circle><path d="M 950 158 L 950 204 L 80 204 L 80 158" fill="none" stroke="#212934" stroke-width="2" stroke-dasharray="5 5"/>
<text x="600" y="226" fill="#6b7684" font-size="12.5" text-anchor="middle" letter-spacing="1.4">EVERY STEP IS SHOWN TO YOU BEFORE THE NEXT ONE STARTS</text>
<circle r="4" fill="#79c0ff">
  <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.36;0.72;1" calcMode="linear"
