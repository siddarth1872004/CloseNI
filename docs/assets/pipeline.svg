<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="A prompt travels from you to CloseNI, to a chat site, to files on your disk, and back to you for review">
<title>The loop CloseNI runs</title>
<rect width="1200" height="250" rx="12" fill="#0b0d0f"/>
<rect x="0.5" y="0.5" width="1199" height="249" rx="12" fill="none" stroke="#212934"/>
<g font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace">
  <text x="40" y="42" fill="#6b7684" font-size="12.5" letter-spacing="2.6">ONE STEP, END TO END</text>
  <g>
  <rect x="40" y="74" width="250" height="84" rx="10" fill="#101418" stroke="#212934"/>
  <rect x="40" y="74" width="3" height="84" rx="1.5" fill="#79c0ff"/>
  <text x="62" y="109" fill="#c9d1d9" font-size="16" font-weight="600" letter-spacing="1.6">YOU</text>
  <text x="62" y="134" fill="#6b7684" font-size="13">a sentence</text>
</g><g>
  <rect x="330" y="74" width="250" height="84" rx="10" fill="#101418" stroke="#212934"/>
  <rect x="330" y="74" width="3" height="84" rx="1.5" fill="#57d38c"/>
  <text x="352" y="109" fill="#c9d1d9" font-size="16" font-weight="600" letter-spacing="1.6">CLOSENI</text>
  <text x="352" y="134" fill="#6b7684" font-size="13">plan · steps · checks</text>
</g><g>
  <rect x="620" y="74" width="250" height="84" rx="10" fill="#101418" stroke="#212934"/>
  <rect x="620" y="74" width="3" height="84" rx="1.5" fill="#bc8cff"/>
  <text x="642" y="109" fill="#c9d1d9" font-size="16" font-weight="600" letter-spacing="1.6">CHAT SITE</text>
  <text x="642" y="134" fill="#6b7684" font-size="13">a real browser tab</text>
</g><g>
  <rect x="910" y="74" width="250" height="84" rx="10" fill="#101418" stroke="#212934"/>
  <rect x="910" y="74" width="3" height="84" rx="1.5" fill="#e3b341"/>
  <text x="932" y="109" fill="#c9d1d9" font-size="16" font-weight="600" letter-spacing="1.6">YOUR DISK</text>
  <text x="932" y="134" fill="#6b7684" font-size="13">files, plus a run file</text>
</g><line x1="290" y1="116" x2="330" y2="116" stroke="#212934" stroke-width="2"/><path d="M 319 111 L 328 116 L 319 121 Z" fill="#3d4655"/><circle r="4.5" fill="#57d38c" opacity="0">
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.0000;0.0125;0.1062;0.1187;1" values="0;0;1;1;0;0"/>
