<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="A loop: ask, write, check with a real compiler, feed the error back, retry twice at most">
<title>What happens when a step fails</title>
<rect width="1200" height="300" rx="12" fill="#0b0d0f"/>
<rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#212934"/>
<g font-family="ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace">
  <text x="40" y="42" fill="#6b7684" font-size="12.5" letter-spacing="2.6">WHEN A STEP FAILS</text>
  <ellipse cx="600" cy="158" rx="400" ry="92" fill="none" stroke="#212934" stroke-width="2" stroke-dasharray="6 7"/><rect x="95" y="124" width="210" height="68" rx="10" fill="#101418" stroke="#212934"/>
<rect x="95" y="124" width="210" height="3" rx="1.5" fill="#79c0ff"/>
<text x="200" y="154" fill="#c9d1d9" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.8">ASK</text>
<text x="200" y="176" fill="#6b7684" font-size="12.5" text-anchor="middle">the step, as a prompt</text><rect x="495" y="32" width="210" height="68" rx="10" fill="#101418" stroke="#212934"/>
<rect x="495" y="32" width="210" height="3" rx="1.5" fill="#bc8cff"/>
<text x="600" y="62" fill="#c9d1d9" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.8">WRITE</text>
<text x="600" y="84" fill="#6b7684" font-size="12.5" text-anchor="middle">files land on disk</text><rect x="895" y="124" width="210" height="68" rx="10" fill="#101418" stroke="#212934"/>
<rect x="895" y="124" width="210" height="3" rx="1.5" fill="#57d38c"/>
<text x="1000" y="154" fill="#c9d1d9" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.8">CHECK</text>
<text x="1000" y="176" fill="#6b7684" font-size="12.5" text-anchor="middle">compiler, not vibes</text><rect x="495" y="216" width="210" height="68" rx="10" fill="#101418" stroke="#212934"/>
<rect x="495" y="216" width="210" height="3" rx="1.5" fill="#e3b341"/>
<text x="600" y="246" fill="#c9d1d9" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.8">REPAIR</text>
<text x="600" y="268" fill="#6b7684" font-size="12.5" text-anchor="middle">the real error goes back</text><circle r="6" fill="#57d38c"><animateMotion dur="9s" repeatCount="indefinite" path="M 200 158 A 400 92 0 0 1 600 66 A 400 92 0 0 1 1000 158 A 400 92 0 0 1 600 250 A 400 92 0 0 1 200 158" calcMode="linear"/>
  <animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="#79c0ff;#bc8cff;#57d38c;#e3b341"/></circle><circle r="12" fill="#57d38c" opacity="0.14"><animateMotion dur="9s" repeatCount="indefinite" path="M 200 158 A 400 92 0 0 1 600 66 A 400 92 0 0 1 1000 158 A 400 92 0 0 1 600 250 A 400 92 0 0 1 200 158" calcMode="linear"/></circle><text x="600" y="146" fill="#c9d1d9" font-size="14" text-anchor="middle" letter-spacing="1.6">TWO REPAIR ATTEMPTS PER STEP</text>
<text x="600" y="170" fill="#6b7684" font-size="12.5" text-anchor="middle">then it stops and tells you, instead of writing broken code forever</text>
</g>
</svg>
