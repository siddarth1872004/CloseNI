<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Run</title>
<link rel="stylesheet" href="styles.css">
<script>
  // The main window's theme, before first paint: the same origin, so the same storage.
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("closeni.theme") || "terminal"); }
  catch (e) { document.documentElement.setAttribute("data-theme", "terminal"); }
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); display: flex; flex-direction: column; overflow: hidden; }
  .rw-bar { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--line); background: var(--panel); }
  .rw-label { color: var(--accent); font-weight: 700; letter-spacing: .12em; font-size: 11px; }
  .rw-cmd { font-family: monospace; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .rw-state { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-md); color: var(--dim); }
  .rw-state.running { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
  .rw-state.ok { color: var(--ok); border-color: var(--ok-line); background: var(--ok-bg); }
  .rw-state.fail { color: var(--err); border-color: var(--err-line); background: var(--err-bg); }
  .rw-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .rw-view { flex: 3; border: 0; border-bottom: 1px solid var(--line); background: #fff; }
  .rw-notice { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; background: var(--surface-raised); }
  .rw-console { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: var(--sp-4) var(--sp-5); font-family: monospace; font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; background: var(--surface-sunken); }
  .rw-console .err { color: var(--err); }
  .rw-console .sys { color: var(--mut); }
  .rw-in { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); background: var(--panel); }
  .rw-in span { font-family: monospace; color: var(--mut); font-size: 12px; }
  .rw-in input { flex: 1; background: none; border: 0; outline: none; color: var(--txt); font-family: monospace; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="rw-bar">
    <span class="rw-label">▶ RUN</span>
    <span class="rw-cmd" id="cmd"></span>
    <span class="rw-state" id="state">starting</span>
    <button class="btn btn-sm" id="restart" title="Stop the program and start it again">Restart</button>
    <button class="btn btn-sm" id="stop" title="Stop the program">Stop</button>
    <button class="btn btn-sm" id="full" title="Full screen on or off (F11)">Windowed</button>
    <button class="btn btn-sm" id="close" title="Stop the program and close this window">Close</button>
  </div>
  <div class="rw-main">
    <webview id="view" class="rw-view hidden" partition="closeni-run"></webview>
    <div id="notice" class="rw-notice hidden"></div>
    <pre id="out" class="rw-console"></pre>
  </div>
  <div class="rw-in">
    <span>stdin ›</span>
    <input id="input" placeholder="type input for the program, Enter sends it" spellcheck="false">
  </div>
<script src="browser-check.js"></script>
<script src="preview-target.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  const out = $("out");
  let text = "";
  let full = true;
  let shownUrl = null;

  function line(cls, s) {
    const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = s;
    out.appendChild(span);
    if (atEnd) out.scrollTop = out.scrollHeight;
  }
  function state(label, cls) { const s = $("state"); s.textContent = label; s.className = "rw-state " + (cls || ""); }
  function setFull(on) { full = on; window.run.fullscreen(on); $("full").textContent = on ? "Windowed" : "Full screen"; }

  window.run.onStarted(function (d) {
    out.innerHTML = ""; text = "";
    $("cmd").textContent = d.command;
    $("cmd").title = d.cwd;
    document.title = "Run - " + d.command;
    state("running", "running");
    line("sys", "$ " + d.command + "\n");
    // A native game window cannot be drawn inside this one, and full screen
    // would cover it, so step aside for it.
    const notice = $("notice");
    notice.classList.toggle("hidden", !d.gui);
    if (d.gui) {
      notice.textContent = "This program opens its own window. This one has left full screen so it does not cover it; the program's output shows below.";
      setFull(false);
    }
    $("input").focus();
  });

  window.run.onOutput(function (d) {
    const s = window.CNBrowser ? window.CNBrowser.stripAnsi(d.text) : d.text;
    text += s;
    line(d.stream === "err" ? "err" : "", s);
    // A web server: show the page itself above its log.
    const target = window.CNPreview && window.CNPreview.previewTarget(text, []);
    if (target && target.kind === "server" && target.url !== shownUrl) {
      shownUrl = target.url;
      const v = $("view");
      v.classList.remove("hidden");
      // Give the server a moment to accept connections after printing its address.
      setTimeout(function () { v.src = target.url.replace("0.0.0.0", "localhost"); }, 400);
    }
  });

  window.run.onExit(function (d) {
    const ok = d.code === 0;
    const how = d.signal ? "stopped (" + d.signal + ")" : "exited with code " + d.code;
    line("sys", "\n[" + how + "]\n");
    state(d.signal ? "stopped" : ok ? "exited 0" : "exit " + d.code, d.signal ? "" : ok ? "ok" : "fail");
  });

  $("restart").onclick = function () { shownUrl = null; $("view").classList.add("hidden"); window.run.restart(); };
  $("stop").onclick = function () { window.run.stop(); };
  $("full").onclick = function () { setFull(!full); };
  $("close").onclick = function () { window.run.close(); };
  $("input").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    const v = e.target.value;
    e.target.value = "";
    line("sys", v + "\n");
    window.run.input(v + "\n");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "F11") { e.preventDefault(); setFull(!full); } });
})();
</script>
</body>
</html>
