# Runs the fast suites on every push and pull request. The end-to-end suite
# drives a real browser for around fifteen minutes and stays a local gate for
# now (roadmap 0.4).
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # test:web and test:ui drive Playwright's own Chromium, which npm ci does
      # not download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile the agent
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify
        run: npm run verify

      # The browser session manager may open a headed window, so give it a
      # display.
      - name: Browser tests
        run: xvfb-run -a npm run test:web

      - name: Panel tests
        run: xvfb-run -a npm run test:ui
